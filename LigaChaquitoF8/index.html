<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liga Chaquito F8 - Etapa 4</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{color-scheme:dark}
        body{background:#050b18;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100svh;font-family:system-ui,Arial,sans-serif;color:#fff;overflow:hidden;padding:12px}
        h1{font-size:clamp(15px,2.2vw,22px);margin-bottom:8px;letter-spacing:3px;color:#ffcc00;text-shadow:2px 3px #000}
        #game-container{position:relative;width:min( min( calc(100vw - 24px), 480px), calc((100svh - 78px)*.75));aspect-ratio:3/4;border:3px solid #244c83;box-shadow:0 0 32px #ffcc0033;background:#102d20;overflow:hidden;touch-action:none}
        canvas{display:block;width:100%;height:100%;background:#1a3a1a;touch-action:none}
        #loading-screen{position:absolute;inset:0;background:#071326;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:20;transition:opacity .45s}
        #loading-screen.hidden{opacity:0;pointer-events:none}
        #loading-bar-container{width:70%;height:16px;background:#222;border:2px solid #667;margin-top:16px}
        #loading-bar{height:100%;width:0;background:linear-gradient(90deg,#ffcc00,#ff8800);transition:width .15s}
        #loading-text{margin-top:10px;font-size:.8rem;color:#bbb}
        #info{margin-top:9px;font-size:clamp(10px,1.6vw,12px);color:#aab6c9;text-align:center;max-width:95vw}
        #main-menu{position:fixed;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;background:#020817eF;padding:12px}
        #menu-art{position:relative;width:min( min(100%, 1100px), calc((100svh - 24px)*1.7778));aspect-ratio:16/9;background:#071326 url('assets/opt/pantalla.webp') center/100% 100% no-repeat;border:3px solid #e5b900;box-shadow:0 0 35px #000;overflow:hidden}
        .menu-hit{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:12px;outline-offset:4px}
        .menu-hit:focus-visible{outline:3px solid white;background:#fff2}
        #play-hit{left:36.5%;top:66%;width:27%;height:22%}
        #rank-hit{left:10.5%;top:69%;width:24%;height:18%}
        #settings-hit{left:65.5%;top:69%;width:25%;height:18%}
        #estado-red{position:absolute;left:0;right:0;top:7%;z-index:5;text-align:center;color:#ffcc00;font-weight:900;letter-spacing:1px;font-size:clamp(18px,3vw,30px);text-shadow:0 2px 0 #000,0 0 10px #000;pointer-events:none;min-height:1.2em}
        #menu-dialog{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#020817c9;padding:16px;z-index:3}
        #menu-dialog.open{display:flex}
        .dialog-card{width:min(92%,430px);max-height:90%;overflow:auto;background:linear-gradient(145deg,#102b50,#071326);border:2px solid #ffcc00;border-radius:14px;padding:clamp(16px,3vw,26px);box-shadow:0 12px 40px #000;color:#fff;text-align:center}
        .dialog-card h2{color:#ffcc00;margin-bottom:14px;font-size:clamp(18px,3vw,26px)}
        .dialog-card p,.dialog-card label{font-size:clamp(12px,2vw,15px);line-height:1.6;color:#e5edf9}
        .dialog-card img{width:100%;max-height:48vh;object-fit:contain;border-radius:8px}
        .action-btn{display:block;width:100%;margin-top:12px;padding:12px 16px;border:2px solid #ffe36b;border-radius:9px;background:linear-gradient(#ffdc35,#e89b00);color:#15100a;font-weight:900;font-size:clamp(14px,2vw,17px);cursor:pointer;box-shadow:0 4px #8a5200}
        .action-btn.secondary{background:linear-gradient(#1677d2,#08458d);border-color:#72baff;color:white;box-shadow:0 4px #032b5b}
        .action-btn:active{transform:translateY(2px);box-shadow:0 2px #8a5200}
        #touch-controls{display:none;position:absolute;inset:auto 0 8px;z-index:5;justify-content:space-between;align-items:end;padding:0 8px;pointer-events:none}
        .touch-pad,.touch-actions{display:grid;gap:5px;pointer-events:auto}
        .touch-pad{grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,38px)}
        .touch-actions{grid-template-columns:repeat(2,48px)}
        .touch-controls button{border:1px solid #ffffff99;border-radius:9px;background:#071326b8;color:white;font-weight:800;font-size:13px;min-height:38px;touch-action:none;user-select:none}
        .touch-pad button:nth-child(1){grid-column:2}.touch-pad button:nth-child(2){grid-column:1;grid-row:2}.touch-pad button:nth-child(3){grid-column:2;grid-row:2}.touch-pad button:nth-child(4){grid-column:3;grid-row:2}
        /* ---- Selección de equipo ---- */
        #team-select{position:fixed;inset:0;z-index:18;overflow-y:auto;background:radial-gradient(circle at 50% 0,#10325f,#020817 70%);padding:14px 12px 28px;-webkit-overflow-scrolling:touch}
        #team-select[hidden]{display:none}
        .ts-wrap{max-width:820px;margin:0 auto;text-align:center}
        #ts-title{color:#ffcc00;font-size:clamp(20px,4vw,32px);letter-spacing:3px;text-shadow:2px 3px #000;margin-top:4px}
        #ts-sub{color:#cfdcf2;font-size:clamp(12px,2.2vw,15px);margin:6px 0 14px}
        #ts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
        .ts-tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 6px 10px;border:2px solid #2d5a96;border-radius:12px;background:linear-gradient(#0f2748,#08142a);color:#fff;cursor:pointer;overflow:hidden;font:inherit;transition:transform .12s,border-color .12s,box-shadow .12s}
        .ts-tile:hover,.ts-tile:focus-visible{border-color:#ffcc00;transform:translateY(-2px);box-shadow:0 6px 18px #000a,0 0 0 2px #ffcc0055;outline:none}
        .ts-tile:active{transform:translateY(1px)}
        .ts-tile.current{border-color:#ffcc00}
        .ts-bar{align-self:stretch;height:8px;margin:0 -6px;background:linear-gradient(90deg,var(--c1) 0 33.4%,var(--c2) 33.4% 66.7%,var(--c3) 66.7%)}
        .ts-art{position:relative;width:100%;height:112px;display:flex;justify-content:center;align-items:flex-end}
        .ts-sprite{height:104px;width:auto!important;background:transparent!important;image-rendering:auto;filter:drop-shadow(0 3px 2px #0009)}
        .ts-badge{position:absolute;top:2px;right:0;width:34px;height:40px;object-fit:contain;border-radius:5px}
        .ts-name{font-size:clamp(11px,2.4vw,13px);font-weight:800;letter-spacing:.5px;line-height:1.15}
        .ts-warn{font-size:9px;font-weight:700;color:#ffb347;background:#3a2300;border:1px solid #ffb34788;border-radius:6px;padding:1px 5px}
        .ts-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
        .ts-actions .action-btn{width:auto;min-width:190px;margin-top:0}
        /* ---- Selección de dificultad ---- */
        #ts-grid.diff-grid{grid-template-columns:1fr;max-width:460px;margin:0 auto;gap:12px}
        .ts-diff{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 14px 16px;border:2px solid #2d5a96;border-radius:14px;background:linear-gradient(#0f2748,#08142a);color:#fff;cursor:pointer;font:inherit;transition:transform .12s,border-color .12s,box-shadow .12s}
        .ts-diff:hover,.ts-diff:focus-visible{border-color:#ffcc00;transform:translateY(-2px);box-shadow:0 6px 18px #000a,0 0 0 2px #ffcc0055;outline:none}
        .ts-diff:active{transform:translateY(1px)}
        .ts-diff.current{border-color:#ffcc00}
        .ts-diff-pips{display:flex;gap:6px}
        .ts-diff-pips i{width:26px;height:8px;border-radius:4px;background:#ffffff26}
        .ts-diff-facil .ts-diff-pips i.on{background:#5fd35f}
        .ts-diff-normal .ts-diff-pips i.on{background:#ffcc00}
        .ts-diff-dificil .ts-diff-pips i.on{background:#ff4a3d}
        .ts-diff-name{font-size:clamp(20px,5vw,26px);font-weight:900;letter-spacing:3px}
        .ts-diff-facil .ts-diff-name{color:#7be07b}.ts-diff-normal .ts-diff-name{color:#ffd84a}.ts-diff-dificil .ts-diff-name{color:#ff6b5e}
        .ts-diff-lema{font-size:clamp(12px,2.6vw,14px);font-weight:700;color:#e5edf9}
        .ts-diff-det{font-size:clamp(11px,2.3vw,13px);line-height:1.4;color:#aab6c9;max-width:34ch}
        .ts-diff-dificil{border-color:#8a2a22;background:linear-gradient(#2a0f12,#12080b)}
        .ts-diff-dificil:hover,.ts-diff-dificil:focus-visible,.ts-diff-dificil.current{border-color:#ff6b5e;box-shadow:0 6px 18px #000a,0 0 0 2px #ff6b5e55}
        #ts-random[hidden]{display:none}
        /* ---- Espera de rival (en línea) ---- */
        #espera-rival{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle at 50% 0,#10325f,#020817 72%)}
        #espera-rival[hidden]{display:none}
        .espera-card{width:min(92%,420px);text-align:center;background:linear-gradient(145deg,#102b50,#071326);border:2px solid #ffcc00;border-radius:16px;padding:clamp(18px,4vw,32px);box-shadow:0 16px 48px #000}
        .espera-card h2{color:#ffcc00;letter-spacing:2px;font-size:clamp(20px,4vw,30px);text-shadow:2px 3px #000;margin-bottom:8px}
        #espera-sub{color:#e5edf9;font-size:clamp(13px,2.4vw,16px);line-height:1.45;min-height:2.8em}
        .espera-escudo{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:12px}
        .espera-escudo img{width:84px;height:100px;object-fit:contain;filter:drop-shadow(0 4px 4px #000)}
        .espera-escudo p{font-weight:900;letter-spacing:1px;color:#fff}
        .espera-pista{height:14px;margin:16px auto;width:78%;background:#111a2e;border:2px solid #667;overflow:hidden;border-radius:3px}
        .espera-pista span{display:block;height:100%;width:40%;background:linear-gradient(90deg,#ffcc00,#ff8800);animation:espera-barra 1.1s ease-in-out infinite}
        @keyframes espera-barra{0%{transform:translateX(-120%)}100%{transform:translateX(280%)}}
        .espera-card .action-btn{margin-top:8px}
        @media (max-width:420px){#ts-grid{grid-template-columns:repeat(2,1fr)}}
        @media (pointer:coarse){#touch-controls{display:flex}#info{max-width:90vw}}
        @media (max-height:520px){body{padding:4px}h1,#info{display:none}#game-container{width:min(calc((100svh - 12px)*.75), calc(100vw - 12px))}#menu-art{width:min(100%, calc((100svh - 12px)*1.7778))}}
    </style>
</head>
<body>
    <h1>LIGA CHAQUITO F8</h1>
    <div id="game-container">
        <canvas id="gameCanvas" width="480" height="640"></canvas>
        <div id="touch-controls" class="touch-controls" aria-label="Controles táctiles">
            <div class="touch-pad">
                <button data-key="KeyW" aria-label="Arriba">▲</button><button data-key="KeyA" aria-label="Izquierda">◀</button><button data-key="KeyS" aria-label="Abajo">▼</button><button data-key="KeyD" aria-label="Derecha">▶</button>
            </div>
            <div class="touch-actions">
                <button id="pause-touch" type="button">PAUSA</button><button data-key="ShiftLeft">SPRINT</button><button data-key="Space">TIRO</button><button data-key="KeyE">PASE</button><button data-key="KeyQ">CAMBIAR</button>
            </div>
        </div>
        <div id="loading-screen">
            <div style="font-size: 1.1rem; color: #ffcc00;">CARGANDO ASSETS...</div>
            <div id="loading-bar-container">
                <div id="loading-bar"></div>
            </div>
            <div id="loading-text">Inicializando preloader...</div>
        </div>
    </div>
    <section id="main-menu" aria-label="Menú principal">
        <div id="menu-art">
            <button class="menu-hit" id="rank-hit" aria-label="Rangos de jugadores" title="Rangos de jugadores"></button>
            <button class="menu-hit" id="play-hit" aria-label="Jugar" title="Jugar"></button>
            <button class="menu-hit" id="settings-hit" aria-label="Configuración" title="Configuración"></button>
            <p id="estado-red" aria-live="polite"></p>
            <div id="menu-dialog"><div class="dialog-card" id="dialog-content"></div></div>
        </div>
    </section>
    <section id="team-select" hidden aria-label="Selección de equipo">
        <div class="ts-wrap">
            <h2 id="ts-title">ELEGÍ TU EQUIPO</h2>
            <p id="ts-sub"></p>
            <div id="ts-grid"></div>
            <div class="ts-actions">
                <button type="button" id="ts-random" class="action-btn secondary">EQUIPO AL AZAR</button>
                <button type="button" id="ts-back" class="action-btn">VOLVER AL MENÚ</button>
            </div>
        </div>
    </section>
    <section id="espera-rival" hidden aria-label="Buscando rival">
        <div class="espera-card">
            <div id="espera-escudo" class="espera-escudo"></div>
            <h2>BUSCANDO RIVAL</h2>
            <p id="espera-sub">Buscando rival...</p>
            <div class="espera-pista" aria-hidden="true"><span></span></div>
            <button type="button" id="espera-cancel" class="action-btn secondary">CANCELAR</button>
        </div>
    </section>
    <div id="info">WASD / flechas · SHIFT sprint · ESPACIO tiro · E pase · R centro · Q cambiar jugador</div>
    <script src="assets/sprites/atlas.js"></script>
    <script src="assets/equipos.js"></script>
    <script src="assets/movilidad.js"></script>
    <script src="assets/animaciones.js"></script>
    <script src="fx.js"></script>
    <script src="game.js"></script>
</body>
</html>
